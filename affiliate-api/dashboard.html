<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Afiliado · Resuelve-API</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0B0E14;--card:#14171f;--line:#232733;--txt:#e8ecf3;--dim:#8b93a5;--dim2:#5f6779;
--acc:#38BDF8;--acc2:#22D3EE;--ok:#4FD1C5;--warn:#F59E0B;--err:#F87171;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--r:12px;
}
body{background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,Inter,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1140px;margin:0 auto;padding:20px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(145deg,var(--acc2),var(--acc));display:grid;place-items:center;font-weight:800;font-size:16px;color:#0a0a0a}
h1{font-size:19px;letter-spacing:-.02em}
.logout{margin-left:auto;padding:8px 14px;background:#1a1d26;border:1px solid var(--line);border-radius:8px;color:var(--dim);font:600 13px/1 var(--mono);cursor:pointer;transition:.15s}
.logout:hover{border-color:var(--acc);color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.h2{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:18px}
.kpi{background:#0e1116;border:1px solid var(--line);border-radius:10px;padding:13px 15px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--acc)}
.kpi.ok::before{background:var(--ok)}
.kpi.warn::before{background:var(--warn)}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700}
.kpi .big{font:700 22px var(--mono);letter-spacing:-.02em;margin-top:6px;color:var(--txt)}
.kpi.ok .big{color:var(--ok)}
.kpi.warn .big{color:var(--warn)}
.link-box{background:#0e1116;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px}
.link-box input{flex:1;background:transparent;border:none;color:var(--txt);font:13px var(--mono);outline:none}
.copy{padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:7px;color:var(--acc);font:600 12px var(--mono);cursor:pointer;transition:.15s}
.copy:hover{background:#1a1d26;border-color:var(--acc)}
.wallet-box{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.wallet-box input{flex:1;background:#0e1116;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px;font:14px var(--mono);outline:none}
.wallet-box input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
.btn{padding:9px 15px;background:linear-gradient(145deg,var(--acc2),var(--acc));border:none;border-radius:8px;color:#0a0a0a;font-weight:700;font-size:13px;cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.1)}
.btn.sec{background:#1a1d26;color:var(--txt);border:1px solid var(--line)}
.btn.sec:hover{border-color:var(--dim2);background:#20262f}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);padding:10px 8px;border-bottom:1px solid var(--line)}
tbody td{padding:10px 8px;border-bottom:1px solid #1a1d26}
.badge{display:inline-block;padding:4px 8px;border-radius:6px;font:600 11px var(--mono);text-transform:uppercase}
.badge.pending{background:#2d2410;color:var(--warn)}
.badge.paid{background:#0f2420;color:var(--ok)}
.empty{text-align:center;padding:40px;color:var(--dim2);font-size:14px}
.mono{font-family:var(--mono);font-size:13px}
.login-wrap{max-width:420px;margin:80px auto;padding:20px}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;font-weight:600}
.form-group input{width:100%;background:#0e1116;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:11px;font:15px/1 inherit;outline:none}
.form-group input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
.error{background:#2d1414;border:1px solid #4a2525;color:#f87171;padding:12px;border-radius:8px;margin-bottom:16px;font-size:13px}
</style>
</head>
<body>

<div id="app"></div>

<script>
const API_URL = 'https://affiliate-api.resuelve-api.lat/api';
let TOKEN = localStorage.getItem('aff_token');

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

async function req(path, opts = {}) {
  const headers = {'Content-Type': 'application/json'};
  if (TOKEN) headers['Authorization'] = `Bearer ${TOKEN}`;

  try {
    const res = await fetch(API_URL + path, {
      ...opts,
      headers: {...headers, ...opts.headers}
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({detail: 'Error'}));
      throw new Error(err.detail || err.message || 'Request failed');
    }
    return await res.json();
  } catch(e) {
    throw e;
  }
}

function renderLogin() {
  $('#app').innerHTML = `
    <div class="login-wrap">
      <div class="top" style="justify-content:center">
        <div class="logo">R</div>
        <h1>Afiliado Dashboard</h1>
      </div>
      <div class="login-card">
        <div id="login-error"></div>
        <form id="login-form">
          <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
          </div>
          <button type="submit" class="btn" style="width:100%">Ingresar</button>
        </form>
      </div>
    </div>
  `;

  $('#login-form').onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = {email: fd.get('email'), password: fd.get('password')};

    try {
      const res = await req('/affiliate/login', {method: 'POST', body: JSON.stringify(data)});
      TOKEN = res.token;
      localStorage.setItem('aff_token', TOKEN);
      renderDashboard();
    } catch(err) {
      $('#login-error').innerHTML = `<div class="error">${err.message}</div>`;
    }
  };
}

function logout() {
  TOKEN = null;
  localStorage.removeItem('aff_token');
  renderLogin();
}

async function renderDashboard() {
  try {
    const data = await req('/affiliate/dashboard');

    $('#app').innerHTML = `
      <div class="wrap">
        <div class="top">
          <div class="logo">R</div>
          <div>
            <h1>Dashboard Afiliado</h1>
            <div style="font-size:13px;color:var(--dim);margin-top:2px">Resuelve-API</div>
          </div>
          <button class="logout" onclick="logout()">Salir</button>
        </div>

        <div class="kpis">
          <div class="kpi warn">
            <div class="lbl">Pendiente</div>
            <div class="big">$${(data.pending_quota / 500000).toFixed(2)}</div>
          </div>
          <div class="kpi ok">
            <div class="lbl">Total Ganado</div>
            <div class="big">$${(data.total_earned / 500000).toFixed(2)}</div>
          </div>
          <div class="kpi">
            <div class="lbl">Referidos</div>
            <div class="big">${data.total_referrals}</div>
          </div>
          <div class="kpi">
            <div class="lbl">Comisiones</div>
            <div class="big">${data.commissions.length}</div>
          </div>
        </div>

        <div class="card">
          <div class="h2">Tu Link de Referido</div>
          <div class="link-box">
            <input id="aff-link" value="${data.aff_link}" readonly>
            <button class="copy" onclick="copyLink()">Copiar</button>
          </div>
          <div style="font-size:12px;color:var(--dim);margin-top:10px">
            Código: <span class="mono" style="color:var(--acc)">${data.aff_code}</span>
          </div>
        </div>

        <div class="card">
          <div class="h2">Wallet USDT (TRC20)</div>
          <div class="wallet-box">
            <input id="wallet" value="${data.wallet_address || ''}" placeholder="TXxx...">
            <button class="btn" onclick="saveWallet()">Guardar</button>
          </div>
          <div style="font-size:12px;color:var(--dim2)">
            Actualiza tu dirección para recibir pagos
          </div>
        </div>

        <div class="card">
          <div class="h2">Historial de Comisiones</div>
          ${data.commissions.length ? `
            <table>
              <thead>
                <tr>
                  <th>Fecha</th>
                  <th>Usuario</th>
                  <th>Monto</th>
                  <th>Estado</th>
                </tr>
              </thead>
              <tbody>
                ${data.commissions.map(c => `
                  <tr>
                    <td class="mono">${new Date(c.created_at * 1000).toLocaleDateString('es')}</td>
                    <td>${c.username || c.email}</td>
                    <td class="mono">$${(c.amount / 500000).toFixed(2)}</td>
                    <td><span class="badge ${c.status}">${c.status === 'paid' ? 'Pagado' : 'Pendiente'}</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          ` : '<div class="empty">Sin comisiones aún</div>'}
        </div>
      </div>
    `;
  } catch(err) {
    if (err.message.includes('401') || err.message.includes('token')) {
      logout();
    } else {
      alert('Error cargando dashboard: ' + err.message);
    }
  }
}

async function copyLink() {
  const link = $('#aff-link').value;
  await navigator.clipboard.writeText(link);
  const btn = $('.copy');
  btn.textContent = '✓ Copiado';
  setTimeout(() => btn.textContent = 'Copiar', 2000);
}

async function saveWallet() {
  const wallet = $('#wallet').value.trim();
  if (!wallet) return alert('Ingresa una dirección válida');

  try {
    await req('/affiliate/profile', {
      method: 'PUT',
      body: JSON.stringify({wallet_address: wallet})
    });
    alert('Wallet guardada correctamente');
  } catch(err) {
    alert('Error: ' + err.message);
  }
}

window.logout = logout;
window.copyLink = copyLink;
window.saveWallet = saveWallet;

// Init
if (TOKEN) renderDashboard();
else renderLogin();
</script>

</body>
</html>
